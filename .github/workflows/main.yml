name: Build Vterm APK

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare project for GitHub Actions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          # Hanya diperlukan di Termux lokal.
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK: $ANDROID_SDK_ROOT"

          echo "Installed NDKs:"
          ls -1 "$ANDROID_SDK_ROOT/ndk"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          test -f "$APK_DIR/vterm-app_apt-android-7-debug_universal.apk"
          test -f "$APK_DIR/vterm-app_apt-android-7-debug_arm64-v8a.apk"

          echo "Built APKs:"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: vterm-debug-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          compression-level: 0
